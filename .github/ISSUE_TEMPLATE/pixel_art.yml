name: 🎨 Pixel Art Contribution
description: Share pixel art sprites, themes, or visual improvements
title: "[Art]: "
labels: ["pixel-art"]
body:
  - type: markdown
    attributes:
      value: |
        See the [asset guide](https://github.com/YeatsLiao/github-farm/blob/main/docs/ASSETS.md) for file names and source records.
  - type: dropdown
    id: contribution_type
    attributes:
      label: What type of art contribution?
      multiple: true
      options:
        - New crop sprites
        - New tree sprites
        - New animal sprites
        - Building/decoration sprites
        - Seasonal theme (winter/autumn/spring)
        - Background scene improvement
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe your art contribution
    validations:
      required: true
  - type: textarea
    id: specs
    attributes:
      label: Technical specs
      description: Dimensions, format, and source
      placeholder: |
        - Sheet dimensions and grid
        - Transparent PNG
        - Author, source link, and usage terms for external art
  - type: textarea
    id: preview
    attributes:
      label: Preview
      description: Attach preview images or mockups
