<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Farm</title>
  <link rel="icon" href="./favicon.png" type="image/png" sizes="32x32">
  <style>
    html { color-scheme: light; background: #faf4e4; color: #39291f; }
    body { margin: 0; font: 1rem/1.5 system-ui, sans-serif; }
    main { max-width: 960px; margin: 0 auto; padding: clamp(1rem, 4vw, 2rem) 1rem; }
    h1 { display: flex; align-items: center; gap: .625rem; font-size: clamp(1.75rem, 4vw, 2.75rem); line-height: 1.15; margin: 0 0 1.25rem; }
    .farm-icon { image-rendering: pixelated; }
    label { display: block; font-weight: 650; margin-bottom: .375rem; }
    .fields { display: flex; flex-wrap: wrap; gap: .5rem; }
    input, button { font: inherit; }
    input { flex: 1 1 15rem; min-width: 0; padding: .65rem .75rem; border: 1px solid #a88d67; border-radius: .375rem; background: #fffcf1; color: inherit; }
    button[type="submit"] { padding: .65rem 1rem; border: 0; border-radius: .375rem; background: #3d522d; color: #fff; font-weight: 650; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    .example { padding: 0; border: 0; background: none; color: #5b3e2c; text-decoration: underline; cursor: pointer; }
    .hint { margin: .5rem 0 1rem; font-size: .875rem; }
    #status:empty { display: none; }
    #status { margin: 0 0 .75rem; }
    #status[data-error] { color: #8a2f23; }
    [hidden] { display: none !important; }
    .farm-view { position: relative; overflow: hidden; border: 1px solid #b79d72; border-radius: .5rem; background: #f7efd9; }
    #farm-image, #farm-canvas { display: block; width: 100%; height: auto; }
    #farm-canvas { image-rendering: pixelated; }
    .controls { margin-bottom: .75rem; padding: .65rem .8rem; background: #f1e6cc; border: 1px solid #ccb48a; border-radius: .5rem; }
    .control-head, .control-foot, .details { display: flex; align-items: center; flex-wrap: wrap; gap: .5rem .8rem; }
    .control-head label { margin: 0; }
    #stage-caption { color: #5d492e; font-size: .9rem; }
    #growth { display: block; box-sizing: border-box; width: 100%; padding: 0; margin: .2rem 0 .45rem; accent-color: #4b6237; cursor: pointer; }
    .milestones { display: flex; flex-wrap: wrap; gap: .3rem; }
    .quiet-button { color: #3d522d; border: 1px solid #ae9c76; background: #fbf5e7; border-radius: .32rem; padding: .28rem .55rem; font-size: .875rem; cursor: pointer; }
    .quiet-button[aria-current="step"], .quiet-button:hover { background: #e0e6cf; }
    #places { position: absolute; inset: 0; pointer-events: none; }
    .map-marker { position: absolute; width: 36px; height: 36px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; border-radius: 50%; transform: translate(-50%, -50%); cursor: pointer; pointer-events: auto; }
    .map-marker::before { content: ""; width: 12px; height: 12px; border: 2px solid #fff4d9; border-radius: 50%; background: #3d522d; box-shadow: 0 1px 3px #372719aa; }
    .map-marker[data-locked]::before { background: #7b725f; }
    .map-marker:hover::before, .map-marker[aria-pressed="true"]::before { background: #c18434; width: 15px; height: 15px; }
    .details { justify-content: space-between; margin: .65rem 0; padding: .65rem .8rem; background: #f7efd9; border-radius: .4rem; }
    .details h2 { font-size: 1rem; margin: 0; }
    .details p { font-size: .875rem; margin: .2rem 0 0; }
    .details .activity { flex: 1 1 17rem; }
    .details .activity-controls { display: flex; align-items: center; flex-wrap: wrap; gap: .65rem; }
    a { color: #5b3e2c; }
    :focus-visible { outline: 2px solid #415f37; outline-offset: 3px; }
  </style>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <h1><img class="farm-icon" src="./favicon.png" width="32" height="32" alt="">GitHub Farm</h1>
    <form id="farm-form" hidden>
      <label for="repository">Public GitHub repository</label>
      <div class="fields">
        <input id="repository" name="repo" placeholder="OWNER/REPO or GitHub link" required maxlength="180" autocomplete="off" autocapitalize="none" spellcheck="false">
        <button id="generate" type="submit">Generate farm</button>
      </div>
      <p class="hint">Try <button id="example" class="example" type="button">octocat/git-consortium</button></p>
    </form>
    <p id="status" role="status"></p>
    <section id="farm-controls" class="controls" aria-label="Farm growth" hidden>
      <div class="control-head">
        <label for="growth">Growth timeline</label>
        <output id="stage-caption" for="growth" aria-live="polite"></output>
      </div>
      <input type="range" id="growth" min="0" step="1" value="0">
      <div class="control-foot">
        <div class="milestones" aria-label="Milestone shortcuts">
          <button class="quiet-button" type="button" data-stars="0">0</button>
          <button class="quiet-button" type="button" data-stars="5">5</button>
          <button class="quiet-button" type="button" data-stars="25">25</button>
          <button class="quiet-button" type="button" data-stars="100">100</button>
          <button class="quiet-button" type="button" data-stars="300">300</button>
          <button class="quiet-button" type="button" id="current-stage">Current farm</button>
        </div>
      </div>
    </section>
    <div class="farm-view">
      <img id="farm-image" src="./farm.png" width="1280" height="960" alt="Pixel-art farm and its GitHub repository's star statistics">
      <canvas id="farm-canvas" role="img" width="1280" height="960" aria-label="Pixel-art farm" hidden></canvas>
      <div id="places" role="group" aria-label="Explore places on the farm" hidden></div>
    </div>
    <section id="place-info" class="details" aria-label="Farm details" hidden>
      <div class="activity" aria-live="polite">
        <h2 id="place-name">Explore the farm</h2>
        <p id="place-description">Select a marker to learn about that part of the farm.</p>
      </div>
      <div class="activity-controls">
        <button type="button" class="quiet-button" id="motion">Pause activity</button>
        <a id="download" href="./farm.png" download>Download current PNG</a>
        <a href="./orchard-growth.png">Orchard comparison</a>
      </div>
    </section>
    <p id="static-download"><a href="./farm.png" download>Download PNG</a></p>
  </main>
</body>
</html>
